name: Build .exe

# - Todo push na main (e PRs): gera o .exe e deixa para download em "Actions > Artifacts".
# - Tag de versão (ex.: v2.0.0): gera o .exe e publica uma Release com ele anexado.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Gerar executável
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Automacao_Slides
          --collect-data pptx
          automacao_slides.py

      - name: Testar se o executável foi gerado
        shell: pwsh
        run: |
          $exe = "dist/Automacao_Slides.exe"
          if (-not (Test-Path $exe)) { throw "Executável não foi gerado" }
          "{0:N1} MB" -f ((Get-Item $exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: Automacao_Slides-${{ github.sha }}
          path: dist/Automacao_Slides.exe
          retention-days: 30

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Automacao_Slides.exe
          generate_release_notes: true
